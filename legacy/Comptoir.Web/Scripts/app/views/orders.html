<div class="page-header">
    <a class="btn btn-primary pull-right" href="#!/commandes/nouvelle">Nouvelle commande</a>
    <h2>Commandes</h2>
</div>
<form class="form-inline" style="margin-bottom:10px">
    <select class="form-control" ng-model="status" ng-change="load()">
        <option value="">Tous les statuts</option>
        <option value="0">Brouillon</option>
        <option value="1">Confirmée</option>
        <option value="2">Expédiée</option>
        <option value="3">Facturée</option>
        <option value="9">Annulée</option>
    </select>
</form>
<table class="table table-striped table-hover table-orders">
    <thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th class="text-right">Total TTC</th></tr></thead>
    <tbody>
        <tr ng-repeat="o in orders" ng-click="open(o)">
            <td>{{o.number || ('#' + o.id)}}</td>
            <td>{{o.customer}}</td>
            <td>{{o.createdOn | date:'dd/MM/yyyy'}}</td>
            <td><span class="label label-{{o.status}}">{{o.statusLabel}}</span></td>
            <td class="text-right">{{o.totalTTC | number:2}} €</td>
        </tr>
    </tbody>
</table>
