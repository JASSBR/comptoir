name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy:
    name: Legacy · .NET Framework 4.8 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # global.json resolves MSBuild.SDK.SystemWeb through the .NET SDK resolver.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@v2
      - name: Build with MSBuild, Razor views precompiled (a broken view fails here)
        run: msbuild legacy/Comptoir.Web/Comptoir.Web.csproj /restore /p:Configuration=Release /p:MvcBuildViews=true /v:minimal
      - name: Package for IIS (xcopy layout)
        shell: pwsh
        run: |
          $out = "legacy-package"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse legacy/Comptoir.Web/bin, legacy/Comptoir.Web/Views, legacy/Comptoir.Web/Scripts, legacy/Comptoir.Web/Content $out
          Copy-Item legacy/Comptoir.Web/Global.asax, legacy/Comptoir.Web/web.config $out
          Remove-Item "$out/bin/*.pdb", "$out/bin/Comptoir.Web.dll.config" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-package
          path: legacy-package

  backend:
    name: New side · build, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Comptoir.slnx
      - name: Build (analyzers on, warnings are errors)
        run: dotnet build Comptoir.slnx -c Release --no-restore
      - name: Format check
        run: dotnet format Comptoir.slnx --verify-no-changes --no-restore
      - name: Test (differential tests against the legacy procedures on SQL Server, API, facade)
        run: dotnet test --solution Comptoir.slnx -c Release --no-build --coverage --coverage-output-format cobertura
      - name: Coverage gate (≥ 80 % of production lines)
        run: python3 eng/coverage-gate.py 80
      - name: Vulnerable dependencies
        run: |
          dotnet list Comptoir.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  frontend:
    name: New UI · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: facade
          push: false
          cache-from: type=gha

  terraform:
    name: Terraform · fmt, validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
